<!DOCTYPE html>
<html lang="pt-BR" class="dark scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FITOTOSO</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            matte: {
              950: '#09090b',
              900: '#111113',
              850: '#17171a',
              800: '#202024',
              700: '#2e2e34',
            }
          }
        }
      }
    }
  </script>

  <style>
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #09090b;
    }
    ::-webkit-scrollbar-thumb {
      background: #27272a;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #3f3f46;
    }

    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    .skeleton-shimmer {
      background: linear-gradient(90deg, #17171a 25%, #222228 50%, #17171a 75%);
      background-size: 200% 100%;
      animation: shimmer 1.8s infinite;
    }

    .modal-backdrop {
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
  </style>
</head>
<body class="bg-matte-950 text-neutral-200 font-sans antialiased min-h-screen selection:bg-neutral-800 selection:text-white flex flex-col justify-between">

  <header class="fixed top-0 left-0 right-0 z-40 bg-matte-950/80 modal-backdrop border-b border-neutral-900">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <a href="#" class="text-white font-extrabold tracking-widest text-lg transition-opacity hover:opacity-80">
        <span class="tracking-[0.25em]">FITOTOSO</span>
      </a>

      <button 
        id="btn-open-modal"
        type="button" 
        class="inline-flex items-center gap-2 px-3.5 py-1.5 text-xs tracking-wider uppercase font-medium text-neutral-300 hover:text-white bg-matte-900 hover:bg-matte-850 border border-neutral-800 rounded-lg transition-colors"
        aria-label="Abrir mapa">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-neutral-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7" />
        </svg>
        <span>Mapa</span>
      </button>
    </div>
  </header>

  <main class="flex-grow pt-20 pb-16 px-4 sm:px-6 lg:px-8 max-w-7xl mx-auto w-full">

    <section id="banner-section" class="mt-4 mb-8">
      <div class="relative w-full rounded-2xl overflow-hidden border border-neutral-800/80 bg-matte-900 min-h-[220px] flex items-center justify-center">
        <div id="banner-skeleton" class="absolute inset-0 skeleton-shimmer z-10 flex items-center justify-center text-neutral-600 text-xs tracking-wider uppercase">
          Carregando...
        </div>

        <img 
          id="banner-image" 
          src="" 
          alt="" 
          class="w-full max-h-[70vh] object-contain mx-auto opacity-0 transition-opacity duration-300 select-none block"
        />
      </div>
    </section>

    <div class="flex justify-end mb-4">
      <span id="gallery-counter" class="text-xs tracking-wider text-neutral-500 font-mono"></span>
    </div>

    <!-- Galeria masonry: as fotos preservam o formato nativo sem corte fixo -->
    <section>
      <div 
        id="gallery-grid" 
        class="columns-1 sm:columns-2 md:columns-3 lg:columns-4 gap-4">
      </div>

      <div id="gallery-status" class="hidden text-center py-16 text-neutral-500 text-sm tracking-wide">
        Nenhuma imagem encontrada.
      </div>
    </section>
  </main>

  <div 
    id="map-modal" 
    class="fixed inset-0 z-50 flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-200"
    role="dialog" 
    aria-modal="true" 
    aria-labelledby="modal-title">

    <div id="modal-overlay" class="absolute inset-0 bg-black/80 modal-backdrop"></div>

    <div 
      id="modal-content"
      class="relative w-full max-w-lg bg-matte-900 border border-neutral-800 rounded-xl p-5 sm:p-6 shadow-2xl z-10">

      <div class="flex items-center justify-between mb-3">
        <div class="flex items-center gap-2">
          <h3 id="modal-title" class="text-base font-semibold text-white">
            Mapa
          </h3>
          <span class="text-xs text-neutral-500">· Em desenvolvimento</span>
        </div>
        <button 
          id="btn-close-modal" 
          type="button" 
          class="text-neutral-400 hover:text-white p-1 rounded transition-colors"
          aria-label="Fechar">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <div class="relative w-full aspect-video rounded-lg overflow-hidden border border-neutral-800 bg-matte-850 flex items-center justify-center">
        <img 
          id="map-image"
          src="mapa.png" 
          alt="Mapa" 
          class="w-full h-full object-cover"
        />

        <div id="map-fallback" class="hidden text-xs text-neutral-500">
          mapa.png não encontrado
        </div>
      </div>
    </div>
  </div>

  <div 
    id="lightbox-modal" 
    class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/90 modal-backdrop opacity-0 pointer-events-none transition-opacity duration-200"
    role="dialog"
    aria-hidden="true">
    
    <button 
      id="lightbox-close" 
      class="absolute top-4 right-4 sm:top-6 sm:right-6 z-50 p-2 text-neutral-400 hover:text-white bg-neutral-900 border border-neutral-800 rounded-full transition-colors">
      <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>

    <div class="relative max-w-5xl max-h-[90vh] flex items-center justify-center">
      <img 
        id="lightbox-image" 
        src="" 
        alt="" 
        class="max-w-full max-h-[85vh] object-contain rounded-lg border border-neutral-800"
      />
    </div>
  </div>

  <footer class="border-t border-neutral-900 py-6 px-4 text-center text-xs text-neutral-600">
    <p>© <span id="current-year"></span> FITOTOSO</p>
  </footer>

  <script>
    document.getElementById('current-year').textContent = new Date().getFullYear();

    const EXTENSIONS = ['png', 'pmg', 'jpg', 'jpeg', 'webp'];
    const MAX_CONSECUTIVE_MISSES = 2;
    const MAX_SEARCH = 100;

    const bannerImage = document.getElementById('banner-image');
    const bannerSkeleton = document.getElementById('banner-skeleton');
    const galleryGrid = document.getElementById('gallery-grid');
    const galleryCounter = document.getElementById('gallery-counter');
    const galleryStatus = document.getElementById('gallery-status');

    function checkImage(url) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => resolve({ ok: true, url });
        img.onerror = () => resolve({ ok: false, url });
        img.src = url;
      });
    }

    async function findFitFile(num) {
      for (const ext of EXTENSIONS) {
        const path = `fit${num}.${ext}`;
        const res = await checkImage(path);
        if (res.ok) return { num, url: path };
      }
      return null;
    }

    async function loadGallery() {
      let totalFound = 0;
      let misses = 0;

      // Banner fit1
      const banner = await findFitFile(1);
      const bannerSection = document.getElementById('banner-section');

      if (banner) {
        bannerImage.src = banner.url;
        bannerImage.onload = () => {
          bannerSkeleton.classList.add('hidden');
          bannerImage.classList.remove('opacity-0');
        };
      } else if (bannerSection) {
        bannerSection.classList.add('hidden');
      }

      // Galeria (fit2 em diante)
      for (let i = 2; i <= MAX_SEARCH; i++) {
        const item = await findFitFile(i);
        if (item) {
          addCard(item.url);
          misses = 0;
          totalFound++;
          galleryCounter.textContent = `${totalFound} ${totalFound === 1 ? 'foto' : 'fotos'}`;
        } else {
          misses++;
          if (misses >= MAX_CONSECUTIVE_MISSES) break;
        }
      }

      if (totalFound === 0) {
        galleryStatus.classList.remove('hidden');
        galleryCounter.textContent = '';
      }
    }

    function addCard(url) {
      const card = document.createElement('div');
      card.className = "break-inside-avoid mb-4 rounded-xl overflow-hidden bg-matte-900 border border-neutral-800/80 cursor-pointer hover:border-neutral-700 transition-colors";

      const wrapper = document.createElement('div');
      wrapper.className = "relative w-full";

      const skeleton = document.createElement('div');
      skeleton.className = "skeleton-shimmer h-48 w-full";

      const img = document.createElement('img');
      img.src = url;
      img.alt = "";
      img.loading = "lazy";
      img.className = "w-full h-auto block opacity-0 transition-opacity duration-300";

      img.onload = () => {
        skeleton.remove();
        img.classList.remove('opacity-0');
      };

      wrapper.appendChild(skeleton);
      wrapper.appendChild(img);
      card.appendChild(wrapper);

      card.addEventListener('click', () => openLightbox(url));
      galleryGrid.appendChild(card);
    }

    // Modal mapa
    const btnOpenModal = document.getElementById('btn-open-modal');
    const btnCloseModal = document.getElementById('btn-close-modal');
    const mapModal = document.getElementById('map-modal');
    const modalOverlay = document.getElementById('modal-overlay');
    const mapImage = document.getElementById('map-image');
    const mapFallback = document.getElementById('map-fallback');

    mapImage.onerror = () => {
      mapImage.classList.add('hidden');
      mapFallback.classList.remove('hidden');
    };

    function openModal() {
      mapModal.classList.remove('opacity-0', 'pointer-events-none');
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      mapModal.classList.add('opacity-0', 'pointer-events-none');
      document.body.style.overflow = '';
    }

    btnOpenModal.addEventListener('click', openModal);
    btnCloseModal.addEventListener('click', closeModal);
    modalOverlay.addEventListener('click', closeModal);

    // Lightbox
    const lightboxModal = document.getElementById('lightbox-modal');
    const lightboxImage = document.getElementById('lightbox-image');
    const lightboxClose = document.getElementById('lightbox-close');

    function openLightbox(url) {
      lightboxImage.src = url;
      lightboxModal.classList.remove('opacity-0', 'pointer-events-none');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      lightboxModal.classList.add('opacity-0', 'pointer-events-none');
      document.body.style.overflow = '';
    }

    lightboxClose.addEventListener('click', closeLightbox);
    lightboxModal.addEventListener('click', (e) => {
      if (e.target === lightboxModal) closeLightbox();
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeModal();
        closeLightbox();
      }
    });

    loadGallery();
  </script>
</body>
</html>
